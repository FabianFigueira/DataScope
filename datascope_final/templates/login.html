
{% extends "layout.html" %}

{% block title %}Login | DataScope{% endblock %}

{% block content %}
<div class="auth-page">
    <a href="/" class="brand auth-brand">
        <span class="brand-icon">D</span> DataScope
    </a>

    <div class="auth-card">
        <div class="auth-symbol">D</div>
        <div class="eyebrow">WELCOME BACK</div>
        <h1>Sign in to DataScope</h1>
        <p class="auth-subtitle">Continue exploring your data.</p>

        <form action="/login" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button type="submit" class="button button-primary auth-submit">Sign in <span>→</span></button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="/register">Create one</a></p>
    </div>

    <div class="auth-footer">DATA ANALYTICS REDEFINED</div>
</div>
{% endblock %}
